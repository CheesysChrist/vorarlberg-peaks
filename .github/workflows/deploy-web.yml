name: Deploy Web (Vercel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --cwd apps/web --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: |
          echo "node-linker=hoisted" >> .npmrc
          vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --cwd apps/web --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Deploy pre-built artifacts
        run: vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --cwd apps/web --token=${{ secrets.VERCEL_TOKEN }}
